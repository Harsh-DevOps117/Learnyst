version: "3.9"

services:
  db:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: adminFutre123
      POSTGRES_PASSWORD: adminFutreKanye123
      POSTGRES_DB: adminFutreMetro123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminFutre123 -d adminFutreMetro123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  lms-api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-api-gateway
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DB_URI: postgresql://adminFutre123:adminFutreKanye123@db:5432/adminFutreMetro123?sslmode=disable
      REDIS_URI: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms
    restart: unless-stopped

  lms-core-service:
    build:
      context: ../lms-core-service
      dockerfile: Dockerfile
    container_name: lms-core-service
    ports:
      - "3001:3001"
    env_file:
      - ../lms-core-service/.env
    environment:
      PORT: 3001
      DB_URI: postgresql://adminFutre123:adminFutreKanye123@db:5432/adminFutreMetro123?sslmode=disable
      REPLICA_DB_URI: postgresql://adminFutre123:adminFutreKanye123@db:5432/adminFutreMetro123?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - shared-assets:/shared
    networks:
      - lms
    restart: unless-stopped

  tenant-proxy-service:
    build:
      context: ../tenant-proxy-service
      dockerfile: Dockerfile
    container_name: tenant-proxy-service
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      PORT: 8080
      DB_URI: postgresql://adminFutre123:adminFutreKanye123@db:5432/adminFutreMetro123?sslmode=disable
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-s3bucket123}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-your_account_key}
      AZURE_CONTAINER_NAME: learnyst-tenant-sites
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms
    restart: unless-stopped

  db-replica:
    image: postgres:17-alpine
    container_name: postgres-replica
    environment:
      POSTGRES_USER: adminFutre123
      POSTGRES_PASSWORD: adminFutreKanye123
      POSTGRES_DB: adminFutreMetro123
    ports:
      - "5433:5432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms
    restart: unless-stopped

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=LMSCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    networks:
      - lms
    healthcheck:
      test: ["CMD-SHELL", "[ $$(nodetool statusgossip) = running ]"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - lms
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - lms
    restart: unless-stopped

  lms-video-worker:
    build:
      context: ../lms-video-worker
      dockerfile: Dockerfile
    container_name: lms-video-worker
    env_file:
      - .env
    environment:
      DB_URI: postgresql://adminFutre123:adminFutreKanye123@db:5432/adminFutreMetro123?sslmode=disable
      KAFKA_BROKER: kafka:29092
    depends_on:
      - kafka
    volumes:
      - shared-assets:/shared
    networks:
      - lms
    restart: unless-stopped

  lms-ai-service:
    build:
      context: ../lms-ai-service
      dockerfile: Dockerfile
    container_name: lms-ai-service
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      PORT: 3002
      DB_URI: postgresql://adminFutre123:adminFutreKanye123@db:5432/adminFutreMetro123?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms
    restart: unless-stopped

  lms-builder-service:
    build:
      context: ../lms-builder-service
      dockerfile: Dockerfile
    container_name: lms-builder-service
    env_file:
      - .env
    environment:
      KAFKA_BROKER: kafka:29092
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-s3bucket123}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-your_account_key}
      AZURE_CONTAINER_NAME: learnyst-tenant-sites
    depends_on:
      - kafka
    networks:
      - lms
    restart: unless-stopped

volumes:
  pgdata:
  shared-assets:

networks:
  lms:
    driver: bridge
