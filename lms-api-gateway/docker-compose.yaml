version: "3.9"

services:
  db:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: adminFutre123
      POSTGRES_PASSWORD: adminFutreKanye123
      POSTGRES_DB: adminFutreMetro123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminFutre123 -d adminFutreMetro123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  lms-api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_URI: postgresql://adminFutre123:adminFutreKanye123@db:5432/adminFutreMetro123?sslmode=disable
      REDIS_URI: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms
    restart: unless-stopped

volumes:
  pgdata:

networks:
  lms:
    driver: bridge
